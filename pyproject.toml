[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "nest-joblib"
version = "1.0.0"
description = "Patch joblib to allow nested parallelism"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "joblib>=1",
  "typing-extensions>=4.16.0",
]
optional-dependencies.all = [
  "dask[distributed]",
  "ray",
]
urls."Bug Tracker" = "https://github.com/34j/nest-joblib/issues"
urls.Changelog = "https://github.com/34j/nest-joblib/blob/main/CHANGELOG.md"
urls.documentation = "https://nest-joblib.readthedocs.io"
urls.repository = "https://github.com/34j/nest-joblib"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
